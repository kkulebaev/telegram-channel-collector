<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telegram Channel Collector banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070A12"/>
      <stop offset="0.55" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="accent" x1="240" y1="64" x2="1040" y2="304" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#10B981"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(900 120) rotate(130) scale(420 320)">
      <stop stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-40" y="-40" width="1280" height="440" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <filter id="shadow" x="0" y="0" width="1200" height="360" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <mask id="fadeRight">
      <rect width="1200" height="360" fill="white"/>
      <rect x="880" y="0" width="320" height="360" fill="url(#fadeRightGrad)"/>
    </mask>

    <linearGradient id="fadeRightGrad" x1="880" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="white"/>
      <stop offset="1" stop-color="black"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="0" y="0" width="1200" height="360" rx="28" fill="url(#glow)"/>

  <!-- Abstract geometry (no badges, no implementation details) -->
  <g opacity="0.95" mask="url(#fadeRight)">
    <path d="M-40 300C140 220 220 180 340 180C470 180 560 250 690 250C860 250 970 150 1240 120" stroke="url(#accent)" stroke-width="10" stroke-linecap="round" opacity="0.65"/>
    <path d="M-20 140C120 90 230 70 360 80C520 95 630 150 770 150C960 150 1080 70 1260 40" stroke="#1F2937" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

    <g filter="url(#softBlur)" opacity="0.65">
      <circle cx="220" cy="110" r="80" fill="#10B981" fill-opacity="0.20"/>
      <circle cx="310" cy="250" r="110" fill="#22D3EE" fill-opacity="0.14"/>
      <circle cx="950" cy="110" r="120" fill="#A78BFA" fill-opacity="0.12"/>
    </g>

    <g opacity="0.9">
      <path d="M140 92L208 132L160 196L92 156Z" fill="#0F172A" stroke="#1F2937" stroke-width="2"/>
      <path d="M980 222L1052 254L1010 320L938 288Z" fill="#0F172A" stroke="#1F2937" stroke-width="2"/>
      <path d="M760 72C790 42 840 42 870 72C900 102 900 152 870 182C840 212 790 212 760 182C730 152 730 102 760 72Z" fill="#0F172A" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
    </g>
  </g>

  <!-- Text -->
  <g>
    <text x="96" y="160" fill="#E5E7EB" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="56" font-weight="850" letter-spacing="-0.02em">Telegram Channel Collector</text>
    <text x="96" y="212" fill="#9CA3AF" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto" font-size="24">Collect and archive posts from Telegram channels</text>

    <!-- Accent underline -->
    <rect x="96" y="236" width="520" height="6" rx="3" fill="url(#accent)" opacity="0.85"/>
  </g>
</svg>
